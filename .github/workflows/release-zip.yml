# 릴리스를 만들면 소스 ZIP(ipad-planner.zip)을 자동으로 첨부한다.
# 소개 페이지의 "설치 파일 받기"가 releases/latest/download/ipad-planner.zip 을 가리키므로 항상 최신 릴리스를 받게 된다.
name: Attach source zip to release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip
        run: git archive --format=zip --prefix=ipad-planner/ -o ipad-planner.zip "${{ github.event.release.tag_name }}"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" ipad-planner.zip --clobber
